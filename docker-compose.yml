services:

  db:
    image: mysql:8.4
    restart: always

    environment:
      MYSQL_DATABASE: scholarship_db
      MYSQL_USER: sch_user
      MYSQL_PASSWORD: schiitbhu@123
      MYSQL_ROOT_PASSWORD: schiitbhu@123

    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

    volumes:
      - .:/app

volumes:
  mysql_data: