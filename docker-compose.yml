services:

  db:
    image: mysql:8.4
    restart: always

    environment:
      MYSQL_DATABASE: scholarship_db
      MYSQL_USER: sch_user
      MYSQL_PASSWORD: schiitbhu@123
      MYSQL_ROOT_PASSWORD: schiitbhu@123

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - .:/app

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  mysql_data:
