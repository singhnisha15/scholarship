{% extends "base.html" %}
<!--{% load socialaccount %}-->
{% block content %}
<style>
.login-page { min-height: 80vh; display: flex; justify-content: center; align-items: center; padding: 40px; }
.login-card { width: 100%; max-width: 500px; background: #fff; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.12); }
.login-card h1 { margin-bottom: 15px; color: #1e3a8a; font-size: 28px; }
.login-card p { color: #555; margin-bottom: 30px; line-height: 1.6; }
.logo { font-size: 50px; margin-bottom: 15px; }
.google-btn { display: inline-block; background: #4285F4; color: #fff; text-decoration: none; padding: 14px 30px; border-radius: 8px; font-size: 16px; font-weight: 600; transition: 0.3s; border: none; cursor: pointer; }
.google-btn:hover { background: #3367d6; transform: translateY(-2px); }
</style>
<div class="login-page">
    <div class="login-card">
        <div class="logo">🎓</div>
        <h1>Scholarship Management System</h1>
        <p>Welcome to the IIT (BHU) Scholarship Management Portal. Please sign in using your institute Google account.</p>
        <form method="post" action="/accounts/google/login/">
            {% csrf_token %}
            <button type="submit" class="google-btn">
                Sign in with Google
            </button>
        </form>
    </div>
</div>
<div class="login-support">
    ✉ For assistance, mail to
    <a href="mailto:nisha.cis@itbhu.ac.in">nisha.cis@itbhu.ac.in</a>
</div>

{% endblock %}
